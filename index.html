<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>paz.social.br E café. — Em Breve</title>
    <meta name="description" content="Em breve um novo espaço para conexões e transformação social. E cafezinho. paz.social.br">
    
    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://paz.social.br/">
    <meta property="og:title" content="paz.social.br">
    <meta property="og:description" content="Em breve, novidades por aqui.">
    
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --accent-color: #2563eb;
            --accent-soft: #eff6ff;
            --border-color: #e2e8f0;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #0f172a;
                --card-bg: #1e293b;
                --text-main: #f8fafc;
                --text-muted: #94a3b8;
                --accent-color: #3b82f6;
                --accent-soft: #1e3a8a;
                --border-color: #334155;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            line-height: 1.6;
        }

        .container {
            max-width: 540px;
            width: 100%;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 3rem 2rem;
            text-align: center;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }

        .badge {
            display: inline-block;
            background-color: var(--accent-soft);
            color: var(--accent-color);
            font-size: 0.875rem;
            font-weight: 600;
            padding: 0.35rem 1rem;
            border-radius: 9999px;
            margin-bottom: 1.5rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        h1 {
            font-size: 2.25rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            margin-bottom: 0.75rem;
        }

        p {
            color: var(--text-muted);
            font-size: 1.125rem;
            margin-bottom: 2rem;
        }

        .contact-btn {
            display: inline-block;
            background-color: var(--accent-color);
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            padding: 0.875rem 2rem;
            border-radius: 8px;
            transition: opacity 0.2s ease;
        }

        .contact-btn:hover {
            opacity: 0.9;
        }

        footer {
            margin-top: 2.5rem;
            font-size: 0.875rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            padding-top: 1.5rem;
        }
    </style>
</head>
<body>
    <main class="container">
        <span class="badge">Em Construção</span>
        <h1>paz.social.br</h1>
        <p>Estamos preparando algo especial.  E café.  Em breve, este projeto estará no ar.</p>
        
        <a href="mailto:contato@paz.social.br" class="contact-btn">Entrar em Contato</a>

        <footer>
            &copy; paz.social.br. Todos os direitos reservados.
        </footer>
    </main>
</body>
</html>
